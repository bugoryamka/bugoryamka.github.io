<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Second Order Dynamics Visualization</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div id="sketch"></div>
    <div class="controls">
      <div class="slider-group">
        <span class="slider-caption">Frequency (f):</span>
        <label>
          <input type="range" id="fSlider" min="0" max="10" step="0.1" value="1">
          <output id="fValue" for="fSlider" style="--min: 0;--max: 10"></output>
        </label>
      </div>
      <div class="slider-group">
        <span class="slider-caption">Damping (z):</span>
        <label style="--c: #BD1550">
          <input type="range" id="zSlider" min="0" max="2" step="0.1" value="0.5">
          <output id="zValue" class="bottom" for="zSlider" style="--min: 0;--max: 2"></output>
        </label>
      </div>
      <div class="slider-group">
        <span class="slider-caption">Response (r):</span>
        <label style="--c: #547980">
          <input type="range" id="rSlider" min="-5" max="2" step="0.1" value="1">
          <output id="rValue" for="rSlider" style="--min: -5;--max: 2"></output>
        </label>
      </div>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
  <script src="main.js"></script>
  <script src="motion.js"></script>
  <script src="secondOrder.js"></script>
  <script src="graph.js"></script>
</body>
</html>
